
services:

  pgdb:
    image: "postgres:18"
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - "qviewng-db:/var/lib/postgresql"
      - ./postgres-init:/docker-entrypoint-initdb.d:ro  # Init scripts directory (read-only)
    restart: unless-stopped
    networks:
      - qviewng-net
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d qview -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  valkey:
    image: "valkey/valkey:8-alpine"
    # Run as a pure cache, not a datastore:
    #   --save ""            disable RDB snapshots; nothing here is worth persisting, and a
    #                        restart should come up empty rather than replay a stale dump
    #   --maxmemory          cap it so it can never pressure the host
    #   --maxmemory-policy   evict the least-recently-used key when full instead of erroring
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - qviewng-net
    # Deliberately no "ports:" mapping -- Valkey holds no auth and must stay reachable only
    # from inside qviewng-net. Use `docker compose exec valkey valkey-cli` to inspect it.
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  qviewng:
    image: "${DOCKER_APP_IMAGE}"
    build: .
    environment:
      - JWT_SECRET
      - BACKEND_PORT
      - FRONTEND_URL
      - SMTP_HOST
      - SMTP_USER
      - SMTP_PASS
      - SMTP_FROM
      # Passed through from the host only if set there. It normally is NOT: the release binary
      # reads VALKEY_URL from the .env.release that the Dockerfile bakes into /app, where it is
      # "redis://valkey:6379" -- the service hostname on qviewng-net. Do not put a VALKEY_URL in
      # the root .env to make local dev work; the dev value is a 127.0.0.1 address, and inside
      # this container that resolves to the container itself, which would silently disable the
      # cache here. Local dev gets its value from .env.dev instead (see compose.dev.yaml).
      - VALKEY_URL
    restart: unless-stopped
    networks:
      - qviewng-net
    depends_on:
      pgdb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"

  cloudflare-tunnel:
    image: "cloudflare/cloudflared:latest"
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - qviewng-net
    depends_on:
      - qviewng

networks:
  qviewng-net: {}

volumes:
  qviewng-db: