events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;

    server {
        listen 80;

        root  /app/frontend/dist;
        index index.html;

        # Live-update streams (Server-Sent Events; see backend/src/live.rs). A regex location wins
        # over the /api prefix below. Each stream is one long-lived response, so nginx must pass
        # every frame on as it arrives instead of buffering it, and must not close the connection
        # after the 60 s that suits ordinary requests. The server sends a keepalive every 15 s.
        location ~ ^/api/.+/stream$ {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 1h;
        }

        # Proxy all /api requests to the Rust backend
        location /api {
            proxy_pass         http://127.0.0.1:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # SPA fallback — all other routes serve index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
